<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
  <meta name="theme-color" content="#000000" />
  <title>mind.exe</title>
  <link rel="icon" href="icons/icon-32.png" sizes="32x32" type="image/png" />
  <link rel="icon" href="icons/icon-16.png" sizes="16x16" type="image/png" />
  <link rel="apple-touch-icon" href="icons/icon-180.png" />
  <link rel="manifest" href="manifest.json" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="mind.exe" />
  <!-- V5.3 fix: the V5.1 index.html was rebuilt from the OTHER project's file by mistake, which has no
       importmap entries for recharts or firebase/* — those bare imports then failed to resolve and the
       page stayed black. This file is the original mind.exe index.html with only the font change
       applied; the importmap at the bottom of head is the part that must never be dropped.
       V3.0 typography: моноширинный шрифт стал основным для всего приложения, а не только для
       цифр. Sora больше не загружается — она не используется ни в одном месте бандла.
       IBM Plex Mono покрывает кириллицу, поэтому русские экраны не деградируют. -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@300;400;500;600&display=swap" rel="stylesheet" />
  <!-- The app is built entirely with Tailwind utility classes (flex, rounded-xl, text-[24px], etc.)
       — inside Claude's artifact preview Tailwind is provided automatically, but a plain static site
       needs it loaded explicitly. Without this script every className does nothing and the app falls
       back to unstyled browser-default form controls. -->
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    /* V3.0: фон чистый чёрный, как в теме приложения (был #040405). */
    html, body { margin: 0; padding: 0; background: #000000; overscroll-behavior: none; }
    /* Базовый шрифт до загрузки бандла — тот же моноширинный, что и внутри приложения,
       иначе первый кадр рисуется системным гротеском и подменяется на глазах. */
    body { font-family: 'IBM Plex Mono', ui-monospace, monospace; font-weight: 400; }
    #root { min-height: 100vh; }
  </style>

  <script>
    // window.storage shim — mind.exe was built against Claude's artifact storage API
    // (get/set/delete/list). Outside that environment this backs the same interface with
    // localStorage, keyed by an anonymous per-browser id so multiple "accounts" on one device
    // don't collide. This is a drop-in replacement only — the app itself never talks to
    // localStorage directly, only through window.storage.
    //
    // NOTE (Firebase migration): this shim is now only used to read pre-Firebase local data
    // during the one-time legacy migration path in app.js (legacyStorage*). All new reads/writes
    // for authenticated users go through Firestore instead — see firebase/* imports in app.js.
    (function () {
      const PREFIX = "mindexe:";
      function fullKey(key, shared) {
        return PREFIX + (shared ? "shared:" : "priv:") + key;
      }
      window.storage = {
        async get(key, shared) {
          const v = localStorage.getItem(fullKey(key, shared));
          if (v === null) return null;
          return { key, value: v, shared: !!shared };
        },
        async set(key, value, shared) {
          localStorage.setItem(fullKey(key, shared), value);
          return { key, value, shared: !!shared };
        },
        async delete(key, shared) {
          localStorage.removeItem(fullKey(key, shared));
          return { key, deleted: true, shared: !!shared };
        },
        async list(prefix, shared) {
          const marker = fullKey(prefix || "", shared);
          const scope = PREFIX + (shared ? "shared:" : "priv:");
          const keys = Object.keys(localStorage)
            .filter((k) => k.startsWith(scope) && k.startsWith(marker))
            .map((k) => k.slice(scope.length));
          return { keys, prefix, shared: !!shared };
        },
      };
    })();
  </script>

  <script type="importmap">
  {
    "imports": {
      "react": "https://esm.sh/react@18.3.1",
      "react-dom": "https://esm.sh/react-dom@18.3.1",
      "react-dom/client": "https://esm.sh/react-dom@18.3.1/client",
      "react/jsx-runtime": "https://esm.sh/react@18.3.1/jsx-runtime",
      "react/jsx-dev-runtime": "https://esm.sh/react@18.3.1/jsx-dev-runtime",
      "recharts": "https://esm.sh/recharts@2.12.7?external=react,react-dom",
      "lucide-react": "https://esm.sh/lucide-react@0.383.0?external=react",
      "firebase/app": "https://www.gstatic.com/firebasejs/12.17.1/firebase-app.js",
      "firebase/auth": "https://www.gstatic.com/firebasejs/12.17.1/firebase-auth.js",
      "firebase/firestore": "https://www.gstatic.com/firebasejs/12.17.1/firebase-firestore.js",
      "firebase/ai": "https://www.gstatic.com/firebasejs/12.17.1/firebase-ai.js",
      "firebase/app-check": "https://www.gstatic.com/firebasejs/12.17.1/firebase-app-check.js"
    }
  }
  </script>
</head>
<body>
  <div id="root"></div>
  <!-- V5.8: added a ?v= cache-buster. Without it, a browser (especially an iOS PWA added to the
       home screen) can keep serving a previously cached app.js indefinitely after a new version is
       uploaded to the same path — every fix in a release can be silently invisible even though the
       file on the server is correct. Bump this number on every new app.js version; the query string
       is otherwise ignored by the server, it only exists to change the URL so the browser treats it
       as a different resource and re-fetches. -->
  <script type="module" src="./app.js?v=3.0"></script>
</body>
</html>

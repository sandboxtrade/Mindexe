<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#000000" />
  <title>mind.exe</title>
  <script>window.__mindExePageStartedAt = performance.now();</script>
  <link rel="icon" href="%BASE_URL%icon-32.png" sizes="32x32" type="image/png" />
  <link rel="icon" href="%BASE_URL%icon-16.png" sizes="16x16" type="image/png" />
  <link rel="apple-touch-icon" sizes="180x180" href="%BASE_URL%icon-180.png" />
  <link rel="apple-touch-icon-precomposed" sizes="180x180" href="%BASE_URL%icon-180.png" />
  <link rel="manifest" href="%BASE_URL%manifest.json" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="mind.exe" />
  <link rel="stylesheet" href="./styles.css" />

  <script>
    // Compatibility shim for the one-time pre-Firebase migration path only.
    (function () {
      const PREFIX = "mindexe:";
      function fullKey(key, shared) {
        return PREFIX + (shared ? "shared:" : "priv:") + key;
      }
      window.storage = {
        async get(key, shared) {
          const v = localStorage.getItem(fullKey(key, shared));
          if (v === null) return null;
          return { key, value: v, shared: !!shared };
        },
        async set(key, value, shared) {
          localStorage.setItem(fullKey(key, shared), value);
          return { key, value, shared: !!shared };
        },
        async delete(key, shared) {
          localStorage.removeItem(fullKey(key, shared));
          return { key, deleted: true, shared: !!shared };
        },
        async list(prefix, shared) {
          const marker = fullKey(prefix || "", shared);
          const scope = PREFIX + (shared ? "shared:" : "priv:");
          const keys = Object.keys(localStorage)
            .filter((k) => k.startsWith(scope) && k.startsWith(marker))
            .map((k) => k.slice(scope.length));
          return { keys, prefix, shared: !!shared };
        }
      };
    })();
  </script>
</head>
<body>
  <div id="boot-fallback" role="status" aria-live="polite">MIND.EXE</div>
  <div id="root"></div>
  <script>
    window.__mindExeBootTimer = setTimeout(function () {
      var el = document.getElementById("boot-fallback");
      if (el && !window.__mindExeStarted) {
        el.textContent = "MIND.EXE · НЕ УДАЛОСЬ ЗАПУСТИТЬ";
        el.style.color = "#95959D";
      }
    }, 9000);
  </script>
  <script type="module" src="./app.js"></script>
</body>
</html>
